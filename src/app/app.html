<div class="container">

  <div class="section">
    <h1>Project Name : {{title()}}</h1>
    <h3>Angular Version : {{angularVersion}}</h3>
  </div>

  <div class="section">
    <h4>Tech & Version (String Interpolation)</h4>
    <p>{{getTechWithVersion()}}</p>
  </div>

  <div class="section">
    <h4>Tech & Version (innerHTML Binding)</h4>
    <div [innerHTML]="getTechWithVersion()"></div>
  </div>

  <div class="section">
    <h5>Total of : {{GetTotal(15,8)}}</h5>
  </div>

  <div class="section">
    <p>Calling SignUp Component From Main (App) Component:</p>
    <app-sign-up></app-sign-up>
  </div>

   <div class="section">
    <p>Event Binding:</p>
    <button (click)="callButtonEvent()"> Click Event Binding</button>
  </div>
</div>
